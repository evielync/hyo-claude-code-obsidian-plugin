  background: var(--background-modifier-border);
  border-radius: var(--radius-s);
}

.hyo-model-custom-row {
  display: flex;
  gap: 6px;
  padding: 4px 8px 4px;
  align-items: center;
}

.hyo-model-custom-input {
  flex: 1;
  font-size: 12px;
  padding: 3px 6px;
  border: 1px solid var(--background-modifier-border);
  border-radius: 4px;
  background: var(--background-primary);
  color: var(--text-normal);
  outline: none;
}

.hyo-model-custom-input:focus {
  border-color: var(--interactive-accent);
}

.hyo-model-custom-btn {
  font-size: 12px;
  padding: 3px 8px;
  border: none;
  border-radius: 4px;
  background: var(--interactive-accent);
  color: var(--text-on-accent);
  cursor: pointer;
  opacity: 1;
}

.hyo-model-custom-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

.hyo-model-popup-item:hover {
  background: var(--background-modifier-hover);
}

.hyo-model-popup-item.active {
  background: var(--background-modifier-hover);
}

.hyo-model-check {
  width: 14px;
  font-size: 12px;
  color: var(--interactive-accent);
}

/* Permission popup */
.hyo-perm-popup {
  z-index: 9999;
  min-width: 220px;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-s);
  padding: 4px;
}

.hyo-perm-popup-item {
  padding: 8px 10px;
  cursor: pointer;
  border-radius: var(--radius-s);
  transition: background 0.1s;
}

.hyo-perm-popup-item:hover {
  background: var(--background-modifier-hover);
}

.hyo-perm-popup-item.active {
  background: var(--background-modifier-hover);
}

.hyo-perm-popup-item-name {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-normal);
  margin-bottom: 2px;
}

.hyo-perm-popup-check {
  font-size: 12px;
  color: var(--interactive-accent);
}

.hyo-perm-popup-item-desc {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.4;
}

/* Drag and drop overlay */
.hyo-chat-panel.hyo-drag-over::after {
  content: "Drop file to attach";
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, var(--interactive-accent) 12%, transparent);
  border: 2px dashed var(--interactive-accent);
  border-radius: var(--radius-m);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 500;
  color: var(--interactive-accent);
  pointer-events: none;
  z-index: 50;
}

.hyo-chat-panel {
  position: relative;
}

/* Slash command menu */
.hyo-slash-menu {
  position: relative;
  max-height: 240px;
  overflow-y: auto;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-s);
  padding: 4px;
  margin-bottom: 2px;
}

.hyo-slash-item {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 7px 10px;
  border-radius: var(--radius-s);
  cursor: pointer;
  transition: background 0.1s;
}

.hyo-slash-item:hover,
.hyo-slash-item-selected {
  background: var(--background-modifier-hover);
}

.hyo-slash-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-normal);
}

.hyo-slash-desc {
  font-size: 11px;
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* File chips in message history */
.hyo-message-file-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 6px;
}

.hyo-message-file-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: var(--radius-s);
  font-size: 12px;
  color: inherit;
  opacity: 0.85;
}

/* Compaction divider line */
.hyo-compaction-line {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  opacity: 0.5;
}

.hyo-compaction-rule {
  flex: 1;
  height: 1px;
  background: var(--background-modifier-border);
}

.hyo-compaction-label {
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 3px;
}

/* Message copy button */
.hyo-message-actions {
  display: flex;
  gap: 4px;
  padding: 2px 0 0 2px;
  opacity: 0;
  transition: opacity 0.15s;
}

.hyo-message-assistant:hover .hyo-message-actions {
  opacity: 1;
}

.hyo-copy-btn {
  color: var(--text-faint);
  padding: 4px;
  border-radius: var(--radius-s);
  display: flex;
  align-items: center;
  line-height: 1;
}

.hyo-copy-btn:hover {
  color: var(--text-muted);
  background: var(--background-modifier-hover);
}

/* Session recovery banner — shown below an assistant message that's a
   thinking-block API error. Lets the user heal the session in one click. */
.hyo-recover-banner {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-m);
  background: var(--background-modifier-error-hover, rgba(255, 100, 80, 0.08));
  border: 1px solid var(--background-modifier-border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hyo-recover-banner-text {
  font-size: 0.9em;
  color: var(--text-muted);
  line-height: 1.4;
}

.hyo-recover-button {
  align-self: flex-start;
  background: var(--interactive-accent);
  color: var(--text-on-accent);
  border: none;
  padding: 6px 14px;
  border-radius: var(--radius-s);
  font-size: 0.9em;
  font-weight: 500;
  cursor: pointer;
}

.hyo-recover-button:hover {
  background: var(--interactive-accent-hover);
}

/* "Claude needs an update" — in place of the too-old-for-this-model error,
   and as a banner above the messages when Hyo spots it first. */
.hyo-claude-update-card {
  margin-top: 4px;
  padding: 12px 14px;
  border-radius: var(--radius-m);
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.hyo-claude-update-banner {
  flex: 0 0 auto;
  margin: 12px 12px 0 12px;
}

.hyo-claude-update-head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hyo-claude-update-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-normal);
}

.hyo-claude-update-text,
.hyo-claude-update-status {
  font-size: 0.9em;
  color: var(--text-muted);
  line-height: 1.4;
}

.hyo-claude-update-error {
  color: var(--text-error);
}

.hyo-claude-update-button {
  align-self: flex-start;
}

.hyo-claude-signin-code {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.hyo-claude-signin-code-row {
  display: flex;
  gap: 6px;
}

.hyo-claude-signin-code-row input {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--font-monospace);
}

.hyo-claude-update-button:disabled,
.hyo-recover-button:disabled {
  opacity: 0.6;
  cursor: default;
}

@keyframes hyo-voice-pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--text-error) 40%, transparent); }
  50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--text-error) 0%, transparent); }
}

/* ── Release card ─────────────────────────────────────────────────────────
   Pinned above the message list after an update. Deliberately not styled as
   an assistant message — this is the plugin talking, not the agent. */
.hyo-release-card {
  flex: 0 0 auto;
  margin: 12px 12px 0 12px;
  padding: 12px 14px;
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border);
  border-left: 3px solid var(--interactive-accent);
  border-radius: var(--radius-s);
}

.hyo-release-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.hyo-release-card-badge {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--interactive-accent);
}

.hyo-release-card-version {
  font-size: 11px;
  color: var(--text-faint);
}

.hyo-release-card-dismiss {
  margin-left: auto;
  background: none;
  border: none;
  box-shadow: none;
  padding: 0 2px;
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
  color: var(--text-faint);
}

.hyo-release-card-dismiss:hover {
  color: var(--text-normal);
}

.hyo-release-card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-normal);
  margin-bottom: 4px;
}

.hyo-release-card-body {
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-normal);
}

/* The bullets carry their own spacing; trim the markdown renderer's outer
   margins so the card doesn't gain a dead band at top and bottom. */
.hyo-release-card-body > div > *:first-child { margin-top: 0; }
.hyo-release-card-body > div > *:last-child { margin-bottom: 0; }
.hyo-release-card-body ul {
  margin: 6px 0 0 0;
  padding-left: 18px;
}
.hyo-release-card-body li { margin-bottom: 4px; }

.hyo-release-card-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.hyo-release-card-btn {
  font-size: 12px;
  padding: 5px 11px;
  border-radius: var(--radius-s);
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--background-modifier-border);
  box-shadow: none;
  cursor: pointer;
}

.hyo-release-card-btn:hover {
  color: var(--text-normal);
  background: var(--background-modifier-hover);
}

/* ── Release notes panel ──────────────────────────────────────────────────
   Every version, rendered in app. Overlays the chat surface rather than
   opening a modal, so it matches the rest of Hyo's panels. */
.hyo-release-notes {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  background: var(--background-primary);
}

.hyo-release-notes-head {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
  padding: 10px 14px;
  border-bottom: 1px solid var(--background-modifier-border);
  background: var(--background-secondary);
}

.hyo-release-notes-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-normal);
}

.hyo-release-notes-close {
  margin-left: auto;
  background: none;
  border: none;
  box-shadow: none;
  padding: 0 2px;
  cursor: pointer;
  font-size: 17px;
  line-height: 1;
  color: var(--text-muted);
}

.hyo-release-notes-close:hover { color: var(--text-normal); }

.hyo-release-notes-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 16px 24px 16px;
  font-size: 13px;
  line-height: 1.6;
  user-select: text;
}

.hyo-session-dropdown-divider {
  height: 1px;
  margin: 4px 0;
  background: var(--background-modifier-border);
}

.hyo-session-dropdown-whatsnew { color: var(--text-muted); }

/* Multiple releases in one card — each needs its own header so the bullets
   don't run together into one undifferentiated list. */
.hyo-release-card-section + .hyo-release-card-section {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--background-modifier-border);
}

.hyo-release-card-section-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 2px;
}

.hyo-release-card-section-version {
  font-size: 11px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.hyo-release-card-section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-normal);
}

/* ============================================================
   History: the panel's second side. Premium list feel —
   soft-shadowed cards, no hard borders, sticky day headers.
   ============================================================ */

.hyo-ts-screen { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--background-primary-alt); }

/* Search bar */
.hyo-ts-search {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 12px 0; background: var(--background-primary-alt);
}
.hyo-ts-search-field {
  flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0;
  background: var(--background-primary-alt); border: 1px solid var(--background-modifier-border);
  border-radius: 8px; padding: 0 8px; height: 32px;
}
.hyo-ts-search-field:focus-within { border-color: var(--interactive-accent); }
.hyo-ts-search-field svg { flex: none; color: var(--text-faint); }
/* Obsidian styles every text input (background, border, radius, focus glow);
   the field wrapper draws the one box, so the input itself draws nothing. */
.hyo-ts-search .hyo-ts-search-field input.hyo-ts-search-input,
.hyo-ts-search .hyo-ts-search-field input.hyo-ts-search-input:focus,
.hyo-ts-search .hyo-ts-search-field input.hyo-ts-search-input:active,
.hyo-ts-search .hyo-ts-search-field input.hyo-ts-search-input:focus-visible {
  flex: 1; min-width: 0; height: 100%; padding: 0; margin: 0;
  background: transparent; border: none; border-radius: 0; box-shadow: none; outline: none;
  font-size: 12.5px; color: var(--text-normal);
}
.hyo-ts-search .hyo-ts-search-input::placeholder { color: var(--text-faint); }
.hyo-plugin .hyo-ts-search button.hyo-ts-search-clear.hyo-ts-search-clear {
  flex: none; display: flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; padding: 0; border: none; border-radius: 50%;
  background: transparent; color: var(--text-faint); cursor: pointer; box-shadow: none;
}
/* Full text is Obsidian's own switch (.checkbox-container), label beside it. */
.hyo-ts-search .hyo-ts-search-mode {
  flex: none; display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font-size: 11.5px; font-weight: 500; white-space: nowrap; color: var(--text-muted);
  user-select: none;
}
.hyo-ts-search .hyo-ts-search-mode-on { color: var(--text-normal); }
.hyo-ts-search .hyo-ts-search-mode .checkbox-container { margin: 0; }
.hyo-plugin .hyo-ts-search button.hyo-ts-refresh.hyo-ts-refresh {
  flex: none; display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0; border-radius: 8px; cursor: pointer;
  background: transparent; border: 1px solid var(--background-modifier-border);
  color: var(--text-muted); box-shadow: none;
}
.hyo-ts-search .hyo-ts-refresh-busy svg { animation: hyo-ts-spin .7s linear infinite; }
@keyframes hyo-ts-spin { to { transform: rotate(360deg); } }
.hyo-ts-searching { padding: 0 12px 6px; font-size: 11px; color: var(--text-faint); background: var(--background-primary); }

.hyo-ts-list { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 12px 14px; }
.hyo-ts-empty { padding: 44px 12px; text-align: center; color: var(--text-faint); font-size: 12.5px; }

/* Sticky, legible day headers */
.hyo-ts-group-block { margin-bottom: 2px; }
.hyo-ts-group {
  position: sticky; top: 0; z-index: 2;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-normal); opacity: .85;
  background: var(--background-primary-alt);
  padding: 10px 2px 7px;
}

/* Premium card: no border, soft shadow, sits above the cream. The pin button
   is always there, bottom right, so nothing changes on hover. */
.hyo-ts-card {
  position: relative;
  background: var(--background-primary);
  border-radius: 12px;
  padding: 12px 12px 10px 14px; margin-bottom: 9px;
  box-shadow: 0 1px 2px rgba(40,30,20,.05), 0 3px 10px rgba(40,30,20,.05);
  cursor: pointer; transition: box-shadow .14s, background .14s;
}
.theme-dark .hyo-ts-card { box-shadow: 0 1px 2px rgba(0,0,0,.25); }

.hyo-ts-title { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13.5px; font-weight: 600; color: var(--text-normal); line-height: 1.3; }
.hyo-ts-pin-mark { flex: none; display: inline-flex; color: var(--interactive-accent); }
.hyo-ts-title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.hyo-ts-peek { font-size: 12px; color: var(--text-muted); margin-top: 5px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.hyo-ts-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.hyo-ts-time { font-size: 10.5px; color: var(--text-faint); display: inline-flex; align-items: center; gap: 6px; }
.hyo-ts-openmark { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--interactive-accent); }

.hyo-plugin .hyo-chat-panel button.hyo-ts-act.hyo-ts-act {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0; color: var(--text-muted);
  background: var(--background-primary-alt);
  border: 1px solid var(--background-modifier-border); border-radius: 8px; cursor: pointer;
}
.hyo-plugin .hyo-chat-panel button.hyo-ts-act-on { color: var(--interactive-accent); border-color: var(--interactive-accent); }

.hyo-plugin .hyo-chat-panel button.hyo-ts-loadmore.hyo-ts-loadmore {
  display: block; margin: 8px auto 6px; padding: 0 18px; height: 36px;
  font-size: 12px; font-weight: 500; color: var(--text-muted);
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border); border-radius: 8px; cursor: pointer;
  box-shadow: 0 1px 2px rgba(40,30,20,.05);
}

@media (hover: hover) {
  .hyo-ts-card:hover { background: var(--background-modifier-hover); box-shadow: 0 2px 4px rgba(40,30,20,.07), 0 6px 18px rgba(40,30,20,.08); }
  .theme-dark .hyo-ts-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,.35); }
  .hyo-plugin .hyo-ts-search button.hyo-ts-search-clear:hover,
  .hyo-plugin .hyo-ts-search button.hyo-ts-refresh:hover,
  .hyo-plugin .hyo-chat-panel button.hyo-ts-loadmore:hover { background: var(--background-modifier-hover); color: var(--text-normal); }
  .hyo-plugin .hyo-chat-panel button.hyo-ts-act:hover { background: var(--background-modifier-hover); color: var(--text-normal); border-color: var(--interactive-accent); }
}

/* ── Mobile session chip + panel (agent · model · permissions) ─────────── */
.hyo-chat-panel { position: relative; }

.hyo-session-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 10px;
  border-radius: 12px;
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-normal);
  cursor: pointer;
}
.hyo-session-chip-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-accent);
  flex-shrink: 0;
}
.hyo-session-chip-name { text-transform: capitalize; }
.hyo-session-chip-tune { color: var(--text-muted); flex-shrink: 0; }

.hyo-session-scrim {
  position: absolute; inset: 0; z-index: 20;
  background: rgba(20, 16, 10, 0.32);
}
.hyo-session-sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 21;
  background: var(--background-primary);
  border-radius: 20px 20px 0 0;
  padding: 8px 16px 22px;
  box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.18);
  max-height: 80%;
  overflow-y: auto;
}
.hyo-session-grab {
  width: 38px; height: 5px; border-radius: 3px;
  background: var(--background-modifier-border);
  margin: 2px auto 12px;
}
.hyo-session-sec { margin-bottom: 14px; }
.hyo-session-sec-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-muted);
  margin: 0 2px 7px;
}
.hyo-session-opt {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 11px 13px; border-radius: 11px;
  background: transparent; border: 1px solid transparent;
  font-size: 15px; font-weight: 500; color: var(--text-normal);
  text-align: left; cursor: pointer;
}
.hyo-session-opt.sel {
  background: var(--background-secondary);
  border-color: var(--background-modifier-border);
  font-weight: 650;
}
.hyo-session-opt-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.hyo-session-opt-name { text-transform: capitalize; }
.hyo-session-opt-tick { margin-left: auto; color: var(--text-accent); font-weight: 700; }
.hyo-session-opt-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hyo-session-opt-desc { font-size: 12px; font-weight: 400; color: var(--text-muted); line-height: 1.35; }
.hyo-session-opt-badge {
  margin-left: 6px; padding: 1px 6px; border-radius: 6px;
  background: var(--background-secondary); color: var(--text-muted);
  font-size: 10.5px; font-weight: 600; text-transform: none;
}
/* A model by ID, as the desktop's picker has. */
.hyo-session-custom { display: flex; gap: 8px; padding: 6px 2px 2px; }
.hyo-session-custom input.hyo-session-custom-input { flex: 1; min-width: 0; height: 38px; font-size: 14px; border-radius: 10px; }
.hyo-plugin button.hyo-session-custom-btn { height: 38px; padding: 0 14px; border-radius: 10px; font-size: 14px; }
/* The context gauge and Compact now, as in the desktop's context popup. */
.hyo-session-context { padding: 4px 4px 2px; }
.hyo-session-context-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
.hyo-session-context-row.small { font-size: 12px; color: var(--text-muted); }
.hyo-plugin button.hyo-session-compact { width: 100%; height: 40px; margin-top: 8px; border-radius: 10px; font-size: 14px; }

/* ── Mobile UI styles (scoped to .is-mobile so desktop is untouched) ─── */
.is-mobile /* Hyo Plugin — Obsidian theme-aware styles */

/* Obsidian's own pane header ("Hyo") renders above this view and is left
   alone — we never hide it or render a duplicate of our own. Our
   conversation tab bar sits at the bottom of the panel, .is-mobile above the input. */

.hyo-plugin {
  height: 100%;
  overflow: hidden;
}
.is-mobile /* Reset all buttons inside plugin — Obsidian themes apply their own
   button styles (border, .is-mobile background, .is-mobile box-shadow) that leak into our UI.
   Note: padding intentionally NOT reset here — each button sets its own. */
.hyo-plugin button {
  background: transparent;
  border: none;
  box-shadow: none;
  outline: none;
  font: inherit;
  color: inherit;
  margin: 0;
  cursor: pointer;
}
.is-mobile .hyo-app {
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--background-primary-alt);
  color: var(--text-normal);
  padding-bottom: 4px;
}
.is-mobile /* Loading & onboarding */
.hyo-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 24px;
  color: var(--text-muted);
  text-align: center;
}
.is-mobile .hyo-onboarding {

  border-color: var(--interactive-accent);
}
.is-mobile .hyo-plan-review-approve.hyo-plan-review-approve:hover {
  background: var(--interactive-accent-hover);
}
.is-mobile /* Streaming state */
.hyo-streaming-cursor {
  display: inline-block;
  width: 7px;
  height: 16px;
  background: var(--interactive-accent);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: hyo-blink 1s step-end infinite;
}
@keyframes hyo-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.is-mobile /* Activity indicator */
.hyo-activity-indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 0;
  color: var(--text-faint);
  font-size: 12px;
  font-style: italic;
}
.is-mobile .hyo-thinking-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--text-faint);
  animation: hyo-dot-pulse 1.4s ease-in-out infinite;
}
.is-mobile .hyo-thinking-dot:nth-child(2) {
  animation-delay: 0.2s;
}
.is-mobile .hyo-thinking-dot:nth-child(3) {
  animation-delay: 0.4s;
}
@keyframes hyo-dot-pulse {
  0%, 80%, 100% { opacity: 0.3; }
  40% { opacity: 1; }
}
.is-mobile /* Compaction banner */
.hyo-compaction-banner {
  text-align: center;
  padding: 8px;
  margin: 12px 0;
  color: var(--text-faint);
  font-size: 12px;
  font-style: italic;
  border-top: 1px dashed var(--background-modifier-border);
  border-bottom: 1px dashed var(--background-modifier-border);
}
.is-mobile /* Input area — a two-tier rounded card: the textarea on its own row, .is-mobile with
   attach/mic/Ask First/send in a controls row beneath. Stacking them (rather
   than one long row) is what stops the controls clipping off the right edge
   on narrow/mobile widths. */
.hyo-input-area {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 4px 12px 12px;
  flex-shrink: 0;
}
.is-mobile .hyo-input-card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border);
  border-radius: 18px;
  padding: 10px 12px 8px;
}
.is-mobile .hyo-input-controls {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
}
.is-mobile /* Real spacer (not margin-left: auto) so the row never collapses the send
   button off-screen when the other controls wrap or grow. */
.hyo-input-controls-spacer {
  flex: 1;
  min-width: 4px;
}
.is-mobile /* File attachment chips */
.hyo-attachment-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.is-mobile .hyo-attachment-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-s);
  font-size: 12px;
  color: var(--text-muted);
  align-self: flex-start;
}
.is-mobile .hyo-attachment-name {
  color: var(--text-normal);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.is-mobile .hyo-attachment-tokens {
  color: var(--text-faint);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.is-mobile .hyo-attachment-chip-ref {
  border-style: dashed;
}
.is-mobile .hyo-attachment-chip-ref .hyo-attachment-tokens {
  color: var(--text-accent);
}
.is-mobile .hyo-attachment-remove.hyo-attachment-remove {
  font-size: 14px;
  line-height: 1;
  color: var(--text-faint);
  padding: 0 2px;
  cursor: pointer;
}
.is-mobile .hyo-attachment-remove:hover {
  color: var(--text-muted);
}
.is-mobile /* Attach (paperclip) button + popup */
.hyo-attach-wrap {
  position: relative;
  flex-shrink: 0;
}
.is-mobile .hyo-attach-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  color: var(--text-faint);
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: color 0.1s, background 0.15s;
}
.is-mobile .hyo-attach-btn:hover {
  color: var(--text-muted);
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-attach-popup {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-s);
  padding: 4px;
  min-width: 180px;
  z-index: 100;
}
.is-mobile .hyo-attach-popup-item.hyo-attach-popup-item {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  width: 100%;
  padding: 7px 10px;
  border-radius: var(--radius-s);
  font-size: 13px;
  color: var(--text-normal);
  text-align: left;
  transition: background 0.1s;
}
.is-mobile .hyo-attach-popup-item svg {
  flex-shrink: 0;
  align-self: center;
  display: inline-block;
}
.is-mobile .hyo-attach-popup-item:hover {
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-input {
  /* Sized by its own height, which Hyo sets as the text grows. The shared
     .hyo-input rule gives it flex: 1, and inside this column card that makes
     the flex basis win over the height, pinning the box at one line. */
  flex: 0 0 auto;
  overflow-y: auto;
  width: 100%;
  min-width: 0;
  padding: 2px 2px 8px;
  border: none;
  background: transparent;
  color: var(--text-normal);
  font-family: var(--font-text);
  font-size: 15px;
  line-height: 1.4;
  resize: none;
  min-height: 24px;
  max-height: 200px;
  /* This is a bare <textarea>, so it inherits Obsidian's default form styling
     AND the active theme's `textarea { border-radius: var(--input-radius) }`.
     The visible container is the .hyo-input-card around it — the textarea
     itself must draw no chrome of its own. Neutralise everything the cascade
     and iOS's native control appearance would otherwise impose, or a rounded
     accent-coloured focus ring shows through (the "orange pill" that grew more
     pill-shaped as the field got taller). */
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
  box-shadow: none;
}
.is-mobile .hyo-input:focus, .is-mobile .hyo-input:focus-visible {
  outline: none;
  border: none;
  box-shadow: none;
}
.is-mobile .hyo-input::placeholder {
  color: var(--text-faint);
}
.is-mobile /* Mic (dictate) button — sits in the controls row, .is-mobile next to attach */
.hyo-mic-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  color: var(--text-muted);
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
}
.is-mobile .hyo-mic-btn:hover {
  color: var(--text-normal);
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-mic-btn.recording {
  color: white;
  background: var(--text-error);
  animation: hyo-voice-pulse 1.5s ease-in-out infinite;
}
.is-mobile .hyo-mic-btn.disabled {
  opacity: 0.5;
  cursor: default;
}
.is-mobile /* Transcribing state — the mic icon becomes a spinning ring so there is an
   unmistakable, .is-mobile touch-visible "something is happening" cue (the old `title`
   tooltip never rendered on mobile). */
.hyo-mic-btn.thinking {
  opacity: 1;
  color: var(--interactive-accent);
  cursor: default;
}
.is-mobile .hyo-mic-spinner {
  animation: hyo-spin 0.7s linear infinite;
  transform-origin: center;
}
@keyframes hyo-spin {
  to {
    transform: rotate(360deg);
  }
}
.is-mobile /* Full-width status line above the input while a voice note transcribes. */
.hyo-transcribing-status {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  margin-bottom: 8px;
  border-radius: 10px;
  background: var(--background-modifier-hover);
  color: var(--text-normal);
  font-size: 13px;
  font-weight: 500;
}
.is-mobile .hyo-transcribing-spinner {
  color: var(--interactive-accent);
  animation: hyo-spin 0.7s linear infinite;
  transform-origin: center;
  flex-shrink: 0;
}
.is-mobile /* Live recording waveform — same strip language as the transcribing status, .is-mobile with mic-driven bars so you can see it's actually hearing you. */
.hyo-listening-strip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  margin-bottom: 8px;
  border-radius: 10px;
  background: var(--background-modifier-hover);
  color: var(--text-normal);
  font-size: 13px;
  font-weight: 500;
}
.is-mobile .hyo-waveform {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 22px;
  flex: 1;
  min-width: 0;
}
.is-mobile .hyo-waveform-bar {
  flex: 1;
  min-width: 2px;
  height: 100%;
  border-radius: 2px;
  background: var(--interactive-accent);
  transform: scaleY(0.06);
  transform-origin: center;
  /* Smooth the per-frame jumps just slightly so it reads as fluid motion. */
  transition: transform 0.06s linear;
  will-change: transform;
}
.is-mobile .hyo-listening-label {
  flex-shrink: 0;
  color: var(--text-muted);
}
.is-mobile /* Failed/timed-out transcription — a persistent, .is-mobile tappable retry state. The
   mic shows a retry arrow in the error colour (still clickable, .is-mobile not dimmed
   like a disabled control), .is-mobile and the status line turns into a retry prompt. */
.hyo-mic-btn.error {
  opacity: 1;
  color: var(--text-error);
  cursor: pointer;
}
.is-mobile .hyo-mic-btn.error:hover {
  color: var(--text-error);
  background: var(--background-modifier-error-hover, var(--background-modifier-hover));
}
.is-mobile .hyo-transcribing-status.error {
  background: var(--background-modifier-error, rgba(229, 83, 75, 0.15));
  color: var(--text-normal);
}
.is-mobile .hyo-transcribing-status.error > svg {
  color: var(--text-error);
  flex-shrink: 0;
}
.is-mobile .hyo-transcribing-dismiss {
  margin-left: auto;
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  padding: 0;
  font-size: 16px;
  line-height: 1;
  color: var(--text-muted);
  background: transparent;
  cursor: pointer;
}
.is-mobile .hyo-transcribing-dismiss:hover {
  color: var(--text-normal);
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-send-btn.hyo-send-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--interactive-accent);
  color: var(--text-on-accent);
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
}
.is-mobile .hyo-send-btn.hyo-send-btn:hover {
  background: var(--interactive-accent-hover);
}
.is-mobile .hyo-send-btn:active {
  transform: scale(0.93);
}
.is-mobile /* Stop button — red */
.hyo-send-btn.hyo-stop.hyo-stop {
  background: var(--text-error);
}
.is-mobile .hyo-send-btn.hyo-stop.hyo-stop:hover {
  background: #b55555;
}
.is-mobile /* Session dropdown */
.hyo-session-dropdown {
  position: relative;
}
.is-mobile .hyo-session-dropdown-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  color: var(--text-muted);
  background: transparent;
  border-radius: var(--radius-s);
  transition: all 0.1s;
}
.is-mobile .hyo-session-dropdown-toggle:hover {
  color: var(--text-normal);
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-session-dropdown-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  z-index: 9999;
  width: 260px;
  max-height: 360px;
  overflow-y: auto;
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border-hover);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-s);
  padding: 4px;
}
.is-mobile /* Mobile: the toggle sits in the bottom bar, .is-mobile so anchoring the menu below it
   (top: 100%) drops it off the bottom of the screen and the conversation list
   can't be seen. Flip it to open upward. */
.is-mobile .hyo-session-dropdown-menu {
  top: auto;
  bottom: calc(100% + 4px);
}
.is-mobile .hyo-session-dropdown-header {
  padding: 4px 14px 6px;
  font-weight: 500;
  font-size: 11px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.is-mobile .hyo-session-dropdown-empty {
  padding: 20px 8px;
  color: var(--text-faint);
  font-size: 13px;
  text-align: center;
}
.is-mobile .hyo-session-dropdown-list {
  display: flex;
  flex-direction: column;
}
.is-mobile .hyo-session-dropdown-date {
  padding: 8px 14px 4px;
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.is-mobile .hyo-session-dropdown-date:first-child {
  padding-top: 0;
}
.is-mobile .hyo-session-dropdown-item.hyo-session-dropdown-item {
  display: block;
  width: 100%;
  padding: 6px 14px;
  color: var(--text-normal);
  font-size: 13px;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  border-radius: var(--radius-s);
}
.is-mobile .hyo-session-dropdown-item:hover {
  background: var(--background-modifier-hover);
}
.is-mobile /* Locked agent/model label (mobile) */
.hyo-locked-agent-label {
  font-size: 12px;
  color: var(--text-muted);
  padding: 4px 8px;
  white-space: nowrap;
}
.is-mobile /* Usage bars — single clickable group */
.hyo-usage-bars-group {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  padding: 3px 6px;
  border-radius: var(--radius-s);
  transition: background 0.1s;
}
.is-mobile .hyo-usage-bars-group:hover {
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-usage-bars-group.stale .hyo-usage-bar-fill, .is-mobile .hyo-usage-bars-group.stale .hyo-usage-bar-label, .is-mobile .hyo-usage-bars-group.stale .hyo-usage-bar-track {
  opacity: 0.45;
}
.is-mobile .hyo-usage-bar-label {
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  min-width: 18px;
}
.is-mobile .hyo-usage-bar-track-wrap {
  position: relative;
  width: 60px;
  padding: 4px 0;
}
.is-mobile .hyo-usage-bar-track {
  display: block;
  height: 4px;
  background: var(--background-modifier-border);
  border-radius: 2px;
  overflow: hidden;
}
.is-mobile .hyo-usage-bar-fill {
  display: block;
  height: 100%;
  background: var(--interactive-accent);
  transition: width 0.3s, background 0.3s;
}
.is-mobile .hyo-usage-bar-fill.warning {
  background: #f39c12;
}
.is-mobile .hyo-usage-bar-fill.danger {
  background: #e74c3c;
}
.is-mobile .hyo-usage-bar-pace {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--text-faint);
  opacity: 0.5;
  pointer-events: none;
}
.is-mobile /* Model selector */
.hyo-model-selector {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--text-muted);
  background: transparent;
  border-radius: var(--radius-s);
  transition: all 0.1s;
}
.is-mobile .hyo-model-selector:hover {
  color: var(--text-normal);
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-model-selector-name {
  font-weight: 500;
}
.is-mobile /* Permission mode selector */
.hyo-permission-mode-selector {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--text-muted);
  background: transparent;
  border-radius: var(--radius-s);
  transition: all 0.1s;
}
.is-mobile .hyo-permission-mode-selector:hover {
  color: var(--text-normal);
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-permission-mode-name {
  font-weight: 500;
}
.is-mobile /* Ask First toggle — lives in the input controls row, .is-mobile between the mic
   button and the send spacer. Simple on/off, .is-mobile no popup. */
.hyo-ask-first-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px;
  font-size: 12.5px;
  color: var(--text-muted);
  background: transparent;
  border-radius: var(--radius-s);
  flex-shrink: 0;
  white-space: nowrap;
  transition: color 0.1s, background 0.15s;
}
.is-mobile .hyo-ask-first-toggle:hover {
  color: var(--text-normal);
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-ask-first-toggle.active {
  color: var(--text-normal);
}
.is-mobile .hyo-ask-first-switch {
  display: inline-flex;
  align-items: center;
  width: 30px;
  height: 17px;
  border-radius: 9px;
  background: var(--background-modifier-border);
  padding: 2px;
  flex-shrink: 0;
  transition: background 0.15s;
}
.is-mobile .hyo-ask-first-switch.on {
  background: var(--interactive-accent);
}
.is-mobile .hyo-ask-first-knob {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--text-on-accent, #fff);
  transition: transform 0.15s;
}
.is-mobile .hyo-ask-first-switch.on .hyo-ask-first-knob {
  transform: translateX(13px);
}
.is-mobile /* Agent selector */
.hyo-agent-selector {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--text-muted);
  background: transparent;
  border-radius: var(--radius-s);
  transition: all 0.1s;
}
.is-mobile .hyo-agent-selector:hover:not(.locked) {
  color: var(--text-normal);
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-agent-selector.locked {
  cursor: default;
  opacity: 0.85;
}
.is-mobile .hyo-agent-name {
  font-weight: 500;
  color: var(--agent-color, var(--text-muted));
  text-transform: capitalize;
}
.is-mobile .hyo-agent-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--agent-color, var(--text-muted));
  flex-shrink: 0;
}
.is-mobile /* Agent popup */
.hyo-agent-popup {
  z-index: 9999;
  min-width: 240px;
  max-width: 320px;
  padding: 4px;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-l);
}
.is-mobile .hyo-agent-popup-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-s);
  cursor: pointer;
}
.is-mobile .hyo-agent-popup-item:hover {
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-agent-popup-item.active {
  background: var(--background-modifier-active-hover);
}
.is-mobile .hyo-agent-popup-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-top: 4px;
  flex-shrink: 0;
}
.is-mobile .hyo-agent-popup-text {
  flex: 1;
  min-width: 0;
}
.is-mobile .hyo-agent-popup-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-normal);
  text-transform: capitalize;
}
.is-mobile .hyo-agent-popup-default {
  font-size: 11px;
  font-weight: 400;
  color: var(--text-muted);
  text-transform: none;
}
.is-mobile .hyo-agent-popup-desc {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
  line-height: 1.3;
}
.is-mobile .hyo-agent-popup-check {
  color: var(--text-accent);
  font-size: 12px;
}
.is-mobile /* Usage popup */
.hyo-usage-popup {
  z-index: 9999;
  min-width: 240px;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-s);
  padding: 8px;
}
.is-mobile .hyo-usage-popup-title {
  padding: 4px 8px;
  font-weight: 600;
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.is-mobile .hyo-usage-divider {
  height: 1px;
  background: var(--background-modifier-border);
  margin: 6px 0;
}
.is-mobile .hyo-usage-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 8px;
  font-size: 13px;
}
.is-mobile .hyo-usage-row.small {
  font-size: 11px;
  color: var(--text-muted);
}
.is-mobile .hyo-usage-label {
  color: var(--text-muted);
}
.is-mobile .hyo-usage-value {
  color: var(--text-normal);
  font-weight: 500;
}
.is-mobile .hyo-usage-bar-inline-wrap {
  position: relative;
  padding: 4px 8px;
}
.is-mobile .hyo-usage-bar-inline {
  height: 6px;
  background: var(--background-modifier-border);
  border-radius: 3px;
  overflow: hidden;
}
.is-mobile .hyo-usage-bar-inline-fill {
  height: 100%;
  background: var(--interactive-accent);
  transition: width 0.3s, background 0.3s;
}
.is-mobile .hyo-usage-bar-inline-fill.warning {
  background: #f39c12;
}
.is-mobile .hyo-usage-bar-inline-fill.danger {
  background: #e74c3c;
}
.is-mobile .hyo-usage-refresh-btn {
  width: 100%;
  padding: 6px 8px;
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
  background: transparent;
  border-radius: var(--radius-s);
  transition: all 0.1s;
}
.is-mobile .hyo-usage-refresh-btn:hover {
  color: var(--text-normal);
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-usage-stale-notice {
  padding: 6px 8px;
  font-size: 11px;
  color: #f39c12;
  line-height: 1.4;
}
.is-mobile /* Model popup */
.hyo-model-popup {
  z-index: 9999;
  min-width: 180px;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-s);
  padding: 4px;
}
.is-mobile .hyo-model-popup-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  font-size: 13px;
  color: var(--text-normal);
  cursor: pointer;
  border-radius: var(--radius-s);
  transition: background 0.1s;
}
.is-mobile .hyo-model-popup-name {
  flex: 1;
}
.is-mobile .hyo-model-popup-context {
  font-size: 11px;
  color: var(--text-faint);
}
.is-mobile .hyo-model-popup-divider {
  height: 1px;
  background: var(--background-modifier-border);
  margin: 4px 0;
}
.is-mobile .hyo-model-custom-row {
  display: flex;
  gap: 6px;
  padding: 4px 8px 4px;
  align-items: center;
}
.is-mobile .hyo-model-custom-input {
  flex: 1;
  font-size: 12px;
  padding: 3px 6px;
  border: 1px solid var(--background-modifier-border);
  border-radius: 4px;
  background: var(--background-primary);
  color: var(--text-normal);
  outline: none;
}
.is-mobile .hyo-model-custom-input:focus {
  border-color: var(--interactive-accent);
}
.is-mobile .hyo-model-custom-btn {
  font-size: 12px;
  padding: 3px 8px;
  border: none;
  border-radius: 4px;
  background: var(--interactive-accent);
  color: var(--text-on-accent);
  cursor: pointer;
  opacity: 1;
}
.is-mobile .hyo-model-custom-btn:disabled {
  opacity: 0.4;
  cursor: default;
}
.is-mobile .hyo-model-popup-item:hover {
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-model-popup-item.active {
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-model-check {
  width: 14px;
  font-size: 12px;
  color: var(--interactive-accent);
}
.is-mobile /* Permission popup */
.hyo-perm-popup {
  z-index: 9999;
  min-width: 220px;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-s);
  padding: 4px;
}
.is-mobile .hyo-perm-popup-item {
  padding: 8px 10px;
  cursor: pointer;
  border-radius: var(--radius-s);
  transition: background 0.1s;
}
.is-mobile .hyo-perm-popup-item:hover {
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-perm-popup-item.active {
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-perm-popup-item-name {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-normal);
  margin-bottom: 2px;
}
.is-mobile .hyo-perm-popup-check {
  font-size: 12px;
  color: var(--interactive-accent);
}
.is-mobile .hyo-perm-popup-item-desc {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.4;
}
.is-mobile /* Drag and drop overlay */
.hyo-chat-panel.hyo-drag-over::after {
  content: "Drop file to attach";
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, var(--interactive-accent) 12%, transparent);
  border: 2px dashed var(--interactive-accent);
  border-radius: var(--radius-m);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 500;
  color: var(--interactive-accent);
  pointer-events: none;
  z-index: 50;
}
.is-mobile .hyo-chat-panel {
  position: relative;
}
.is-mobile /* Slash command menu */
.hyo-slash-menu {
  position: relative;
  max-height: 240px;
  overflow-y: auto;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-s);
  padding: 4px;
  margin-bottom: 2px;
}
.is-mobile .hyo-slash-item {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 7px 10px;
  border-radius: var(--radius-s);
  cursor: pointer;
  transition: background 0.1s;
}
.is-mobile .hyo-slash-item:hover, .is-mobile .hyo-slash-item-selected {
  background: var(--background-modifier-hover);
}
.is-mobile .hyo-slash-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-normal);
}
.is-mobile .hyo-slash-desc {
  font-size: 11px;
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.is-mobile /* File chips in message history */
.hyo-message-file-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 6px;
}
.is-mobile .hyo-message-file-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: var(--radius-s);
  font-size: 12px;
  color: inherit;
  opacity: 0.85;
}
.is-mobile /* Compaction divider line */
.hyo-compaction-line {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  opacity: 0.5;
}
.is-mobile .hyo-compaction-rule {
  flex: 1;
  height: 1px;
  background: var(--background-modifier-border);
}
.is-mobile .hyo-compaction-label {
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 3px;
}
.is-mobile /* Message copy button */
.hyo-message-actions {
  display: flex;
  gap: 4px;
  padding: 2px 0 0 2px;
  opacity: 0;
  transition: opacity 0.15s;
}
/* On a phone the copy button is always there. Revealing it on :hover made
   iOS spend the first tap on a reply (a link, a file chip) as a hover. */
.is-mobile .hyo-message-actions,
.is-mobile .hyo-message-assistant:hover .hyo-message-actions {
  opacity: 1;
}
.is-mobile .hyo-copy-btn {
  color: var(--text-faint);
  padding: 4px;
  border-radius: var(--radius-s);
  display: flex;
  align-items: center;
  line-height: 1;
}
.is-mobile .hyo-copy-btn:hover {
  color: var(--text-muted);
  background: var(--background-modifier-hover);
}
.is-mobile /* Session recovery banner — shown below an assistant message that's a
   thinking-block API error. Lets the user heal the session in one click. */
.hyo-recover-banner {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-m);
  background: var(--background-modifier-error-hover, rgba(255, 100, 80, 0.08));
  border: 1px solid var(--background-modifier-border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.is-mobile .hyo-recover-banner-text {
  font-size: 0.9em;
  color: var(--text-muted);
  line-height: 1.4;
}
.is-mobile .hyo-recover-button {
  align-self: flex-start;
  background: var(--interactive-accent);
  color: var(--text-on-accent);
  border: none;
  padding: 6px 14px;
  border-radius: var(--radius-s);
  font-size: 0.9em;
  font-weight: 500;
  cursor: pointer;
}
.is-mobile .hyo-recover-button:hover {
  background: var(--interactive-accent-hover);
}
@keyframes hyo-voice-pulse {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--text-error) 40%, transparent); }
  50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--text-error) 0%, transparent); }
}
.is-mobile /* iPad/tablet fix (2026-07-18): on `is-tablet`, .is-mobile Obsidian collapses button-icon
   SVG width to 0 (diagnostic showed svg:0x15) so the icons vanish while the
   buttons stay. Force explicit icon dimensions so nothing can flatten them. */
.hyo-input-controls.hyo-input-controls button svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
.is-mobile /* Remove the white seam at the top: Obsidian's pane header for our view
   renders white while the chat panel is cream. Paint the whole leaf (header
   included) to match --background-primary-alt. Scoped to our view type only. */
.workspace-leaf-content.workspace-leaf-content[data-type="hyo-plugin-view"] {
  background: var(--background-primary-alt);
}
.is-mobile .workspace-leaf-content[data-type="hyo-plugin-view"] .view-header.view-header {
  background: transparent;
  border-bottom: none;
}
/* White-seam fix (mobile): Hyo lives in Obsidian's mobile drawer. In light
   mode the drawer chrome is white while the chat is cream, leaving seams above
   and below the panel. HyoView marks the drawer that hosts it with
   .hyo-drawer-host (and removes it on close), and every drawer surface inside
   it is painted --background-primary-alt. */
.is-mobile .workspace-drawer.hyo-drawer-host,
.is-mobile .workspace-drawer.hyo-drawer-host [class*="workspace-drawer"],
.is-mobile .workspace-drawer.hyo-drawer-host .workspace-leaf,
.is-mobile .workspace-drawer.hyo-drawer-host .workspace-leaf-content,
.is-mobile .workspace-drawer.hyo-drawer-host .view-header,
.is-mobile .workspace-drawer.hyo-drawer-host .view-content,
.is-mobile .workspace-drawer.hyo-drawer-host .metadata-content,
.is-mobile .workspace-drawer.hyo-drawer-host .metadata-container,
.is-mobile .workspace-drawer.hyo-drawer-host .view-content > * {
  background-color: var(--background-primary-alt);
  border-color: transparent;
}
.is-mobile .workspace-drawer.hyo-drawer-host .workspace-drawer-active-tab-container,
.is-mobile .workspace-drawer.hyo-drawer-host .workspace-drawer-active-tab-header {
  border-bottom: none;
}

/* Left-align session panel options (beats Obsidian mobile's centred button default) */
.hyo-session-sheet .hyo-session-opt { justify-content: flex-start; text-align: left; }

/* Mobile access self-check results (Settings → Hyo → Mobile) */
.hyo-mobile-check { margin: 4px 0 18px; }
.hyo-mobile-check-row {
  padding: 8px 12px; margin-bottom: 6px;
  border-left: 2px solid var(--background-modifier-border);
  background: var(--background-secondary);
  border-radius: 0 6px 6px 0;
}
.hyo-mobile-check-head { display: flex; align-items: baseline; gap: 8px; font-weight: 500; }
.hyo-check-ok { color: var(--color-green); font-weight: 700; }
.hyo-check-fail { color: var(--color-red); font-weight: 700; }
.hyo-mobile-check-detail { margin-top: 2px; font-size: 12px; color: var(--text-muted); word-break: break-word; }
.hyo-mobile-check-fix { margin-top: 4px; font-size: 12px; color: var(--text-accent); }

/* ── Tool call summary line (when "Show every tool call" is off) ── */
.hyo-tool-run {
  margin: 6px 0;
  font-size: 12px;
}
.hyo-tool-run-header {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 6px;
  margin-left: -6px;
  border-radius: var(--radius-s);
  cursor: pointer;
  color: var(--text-muted);
}
.hyo-tool-run-header:hover {
  background: var(--background-modifier-hover);
  color: var(--text-normal);
}
.hyo-tool-run-summary.is-running {
  animation: hyo-tool-run-pulse 1.6s ease-in-out infinite;
}
@keyframes hyo-tool-run-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.hyo-tool-run-body {
  margin: 4px 0 0 4px;
  padding-left: 10px;
  border-left: 2px solid var(--background-modifier-border);
}
.hyo-tool-run-body .hyo-tool-call {
  margin: 4px 0;
}

/* ============================================================
   Voice call bar (22 Oct 2026). A call sits at the top of the
   chat like a phone call; the chat and input stay. Each finished
   call is one line in the chat that opens its transcript.
   Design: chad/assets/hyo-call-bar-mockup.html
   ============================================================ */
.hyo-callbar-wrap {
  flex-shrink: 0;
  padding: 8px 8px 6px;
  background: var(--background-primary);
  border-bottom: 1px solid var(--background-modifier-border);
}
.hyo-callbar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 7px 7px 6px;
  border-radius: 16px;
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border);
  overflow: hidden;
  animation: hyo-callbar-in 0.22s ease-out;
}
/* A soft wash of the orb's colours behind its side of the bar. */
.hyo-callbar::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.16;
  background:
    radial-gradient(120px 60px at 24px 50%, #16c47f, transparent 70%),
    radial-gradient(160px 70px at 70px 50%, #7c3aed, transparent 70%),
    radial-gradient(140px 60px at 120px 60%, #ff0260, transparent 70%);
}
.theme-dark .hyo-callbar::before { opacity: 0.22; }
.hyo-callbar.connecting::before { opacity: 0.08; }
.hyo-callbar > * { position: relative; }
@keyframes hyo-callbar-in {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: none; }
}
.hyo-callbar-orb { width: 40px; height: 40px; flex-shrink: 0; }
.hyo-callbar-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.hyo-callbar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-normal);
  display: flex;
  align-items: center;
  gap: 6px;
}
.hyo-callbar-live {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #16c47f;
  box-shadow: 0 0 0 3px rgba(22, 196, 127, 0.18);
}
.hyo-callbar-status {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}
.hyo-callbar-status b { font-weight: 500; color: var(--text-normal); }
.hyo-callbar button.hyo-callbar-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: none;
  background: transparent;
  box-shadow: none;
  color: var(--text-muted);
  flex-shrink: 0;
  padding: 0;
  cursor: pointer;
}
.hyo-callbar button.hyo-callbar-btn:hover { background: var(--background-modifier-hover); color: var(--text-normal); }
.hyo-callbar button.hyo-callbar-btn.muted {
  background: color-mix(in srgb, var(--color-red) 14%, transparent);
  color: var(--color-red);
}
.hyo-callbar button.hyo-callbar-end {
  width: 44px;
  height: 32px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  border: none;
  background: var(--color-red);
  color: #fff;
  flex-shrink: 0;
  padding: 0;
  cursor: pointer;
  box-shadow: 0 1px 2px color-mix(in srgb, var(--color-red) 35%, transparent);
}
.hyo-callbar button.hyo-callbar-end:hover { filter: brightness(1.06); }
.hyo-callbar svg { display: block; }

/* One line per call, where it started. */
button.hyo-callline {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  height: auto;
  margin: 0 0 16px;
  padding: 8px 10px 8px 8px;
  border-radius: 12px;
  border: 1px solid var(--background-modifier-border);
  background: var(--background-primary);
  box-shadow: none;
  color: var(--text-normal);
  cursor: pointer;
  text-align: left;
  font: inherit;
}
button.hyo-callline:hover { background: var(--background-secondary); }
.hyo-callline-icon {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  background: conic-gradient(from 210deg, #16c47f, #7c3aed, #ff0260, #16c47f);
  flex-shrink: 0;
}
.hyo-callline-label { font-size: 13px; font-weight: 500; }
.hyo-callline-dur { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.hyo-callline-when { margin-left: auto; font-size: 11.5px; color: var(--text-faint); }
.hyo-callline-chev { color: var(--text-faint); display: flex; }

/* The call's transcript, in a sheet over the chat. */
.hyo-callsheet-backdrop {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: flex-end;
  background: rgba(30, 24, 18, 0.28);
  animation: hyo-fade-in 0.15s ease-out;
}
.theme-dark .hyo-callsheet-backdrop { background: rgba(0, 0, 0, 0.45); }
@keyframes hyo-fade-in { from { opacity: 0; } to { opacity: 1; } }
.hyo-callsheet {
  width: 100%;
  max-height: 78%;
  display: flex;
  flex-direction: column;
  background: var(--background-primary);
  border-radius: 18px 18px 0 0;
  border-top: 1px solid var(--background-modifier-border);
  box-shadow: 0 -10px 30px rgba(30, 20, 10, 0.18);
  animation: hyo-sheet-up 0.22s ease-out;
}
@keyframes hyo-sheet-up { from { transform: translateY(24px); } to { transform: none; } }
.hyo-callsheet-grip {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--background-modifier-border);
  margin: 8px auto 2px;
}
.hyo-callsheet-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px 12px;
  border-bottom: 1px solid var(--background-modifier-border);
}
.hyo-callsheet-title { font-size: 15px; font-weight: 600; color: var(--text-normal); }
.hyo-callsheet-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.hyo-callsheet button.hyo-callsheet-close {
  margin-left: auto;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  box-shadow: none;
  padding: 0;
  display: grid;
  place-items: center;
  background: var(--background-secondary);
  color: var(--text-muted);
  cursor: pointer;
}
.hyo-callsheet-body {
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  user-select: text;
}
.hyo-callsheet-user {
  align-self: flex-end;
  max-width: 82%;
  background: var(--background-secondary);
  padding: 8px 12px;
  border-radius: 14px 14px 4px 14px;
  font-size: 13.5px;
  line-height: 1.45;
}
.hyo-callsheet-agent { align-self: flex-start; max-width: 86%; font-size: 13.5px; line-height: 1.5; }
.hyo-callsheet-who { font-size: 11px; color: var(--text-faint); margin-bottom: 2px; }
.hyo-callsheet-handoff {
  align-self: center;
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 92%;
  padding: 4px 10px;
  border: 1px dashed var(--background-modifier-border);
  border-radius: 999px;
  font-size: 11.5px;
  color: var(--text-muted);
}
.hyo-callsheet-handoff span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hyo-callsheet-end { align-self: center; font-size: 11px; color: var(--text-faint); padding-top: 4px; }

/* Phone: a touch more room for thumbs. */
.is-mobile .hyo-callbar button.hyo-callbar-btn { width: 36px; height: 36px; }
.is-mobile .hyo-callbar button.hyo-callbar-end { width: 48px; height: 36px; border-radius: 18px; }
.is-mobile .hyo-callsheet { max-height: 85%; padding-bottom: env(safe-area-inset-bottom); }

/* ── Background jobs ───────────────────────────────────────────────────────
   One line per job just above the composer, Grok Bot style: who's on it and
   what it's doing right now. Each goes when its job finishes. */
.hyo-jobs {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px 12px 4px;
  flex-shrink: 0;
}
.hyo-job {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-muted);
  animation: hyo-job-in 0.2s ease-out;
}
@keyframes hyo-job-in {
  from { opacity: 0; transform: translateY(3px); }
  to   { opacity: 1; transform: none; }
}
.hyo-job-avatar {
  position: relative;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border);
  color: var(--text-accent);
  font-size: 10px;
  font-weight: 600;
}
/* A soft ring that breathes while the job works. */
.hyo-job-avatar::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1.5px solid var(--interactive-accent);
  opacity: 0;
