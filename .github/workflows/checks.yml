name: Checks

# Runs on every push to a branch, so a problem the Obsidian store's scanner
# would flag shows up while the work is in progress, not on release day.
# Tags are left to release.yml, which runs the same checks before building.
on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
